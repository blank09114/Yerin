<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'박예린 포트폴리오 - ' + ${post.postTitle}">박예린 포트폴리오 - 제목</title>
    <link rel="stylesheet" th:href="@{/css/commons.css}">
    <link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
    <!-- 헤더 -->
    <header th:replace="commons :: header"></header>

    <!-- 섹션 -->
    <section>
        <div class="postContentWrap">
            <!-- 게시글 정보 -->
            <div class="postIntro">
                <!-- 분류 -->
                <p class="postInfoText" th:text="${#strings.toUpperCase(post.postTag)}">분류</p>

                <!-- 제목 -->
                <h1 class="postTitle" th:text="${post.postTitle}">제목</h1>

                <!-- 부제목 -->
                <p class="postInfoText" th:text="${post.postSubTitle}">부제목</p>

                <!-- 깃허브 링크 -->
                <p class="postInfoText" th:if="${post.postGit != null and post.postGit != ''}">
                    GIT - <a class="gitLink" th:href="${post.postGit}" th:text="${post.postGit}" target="_blank">깃허브 링크</a>
                </p>
            </div>

            <!-- 게시글 내용 -->
            <div class="postContent" th:utext="${post.postContent}">내용</div>

            <!-- 버튼 -->
            <div class="btnWrap" sec:authorize="isAuthenticated()">
                <a class="btn" th:href="@{/edit/{id}(id=${post.postId})}">수정</a>
                <button class="btn" th:attr="data-id=${post.postId}, data-tag=${post.postTag}"
                        onclick="deletePost(this.dataset.id, this.dataset.tag)">
                    삭제
                </button>
            </div>
        </div>
    </section>

    <!-- 푸터 -->
    <footer th:replace="commons :: footer"></footer>

    <script th:inline="javascript">
        // 삭제
        function deletePost(postId, postTag)
        {
            if (confirm("정말 삭제하시겠습니까?"))
            {
                fetch('/delete/' + postId, { method: 'POST' })
                .then(res => res.text())
                .then(data =>
                {
                    if (data === "success") { window.location.href = '/board/' + postTag.toLowerCase(); }
                    else { alert("삭제에 실패했습니다."); }
                })
                .catch(err =>
                {
                    console.error(err);
                    alert("에러가 발생했습니다.");
                });
            }
        }
    </script>
</body>
</html>
