<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박예린 포트폴리오 - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/commons.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <!-- 헤더 -->
    <header th:replace="commons :: header"></header>

    <!-- 섹션 -->
    <section class="loginSection">
        <!-- 로그인 폼 -->
        <form id="loginForm" th:action="@{/login/request}" method="post">
            <h1 class="formHeader">로그인</h1>

            <!-- 폼 요소 -->
            <div class="formContent">
                <!-- 인풋 -->
                <div class="inputsWrap">
                    <input class="input" id="idInput" type="text" name="username" placeholder="ID">
                    <input class="input" id="pwInput" type="password" name="password" placeholder="PW">
                </div>

                <!-- 버튼 -->
                <button type="button" class="btn" id="formBtn" onclick="login()">로그인</button>
            </div>
        </form>
    </section>

    <!-- 푸터 -->
    <footer th:replace="commons :: footer"></footer>

    <script th:inline="javascript">
        // 로그인 유효성 검사
        function login()
        {
            // 요소
            let id = document.getElementById('idInput').value.trim();
            let pw = document.getElementById('pwInput').value.trim();
            let btn = document.getElementById('formBtn');

            // 입력 검증
            if (id === "") { alert("아이디를 입력하세요."); idInput.focus(); return; }
            if (pw === "") { alert("비밀번호를 입력하세요."); pwInput.focus(); return; }

            // 폼 제출
            document.getElementById('loginForm').submit();
        }

        // 로그인 실패 처리
        if ([[${param.error}]] != null) { alert("아이디 또는 비밀번호가 잘못되었습니다."); }
    </script>
</body>
</html>
